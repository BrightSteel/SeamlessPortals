plugins {
	id 'java'
	id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

apply from: rootProject.file('gradle/versions.gradle')

base {
	archivesName = "seamlessportals-paper-mc${mcProps.minecraft_version}"
}

repositories {
	mavenCentral()
	maven {
		name = 'PaperMC'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	paperweight.paperDevBundle(mcProps.paper_dev_bundle)
}

// Server half (portal discovery, chunk/entity streaming, travel) shared with the Fabric mod.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('plugin.yml') {
		expand props
	}
}

// The API alone (dev.ryan.seamlessportals.api and its events), for other plugins to compile
// against. It only uses Bukkit types, so it's the same for every Minecraft version.
def apiClasses = 'dev/ryan/seamlessportals/api/**'
def apiJar = tasks.register('apiJar', Jar) {
	archiveBaseName = 'seamlessportals-paper-api'
	from(sourceSets.main.output) { include apiClasses }
}
def apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
	archiveBaseName = 'seamlessportals-paper-api'
	archiveClassifier = 'sources'
	from(sourceSets.main.allJava) { include apiClasses }
}
tasks.named('assemble') { dependsOn apiJar, apiSourcesJar }
