name: NetherView
version: '${version}'
main: dev.ryan.netherview.paper.NetherViewPlugin
api-version: '1.21'
description: Streams the far side of nether portals to players running the NetherView client mod, and makes linked portals walk-through.
commands:
  nvportal:
    description: Create and manage custom portals.
    usage: /nvportal help
    permission: netherview.admin
    aliases: [nvp]
permissions:
  netherview.admin:
    description: Create, link and delete custom portals, and use the portal wand.
    default: op
  netherview.use.*:
    description: Use (and see through) every custom portal. Per portal - netherview.use.<name>.
    default: op
    children:
      netherview.see.*: true
  netherview.see.*:
    description: See through every custom portal without using it. Per portal - netherview.see.<name>.
    default: op
