name: SeamlessPortals
version: '${version}'
main: dev.ryan.seamlessportals.paper.SeamlessPortalsPlugin
api-version: '1.21'
description: Streams the far side of nether portals to players running the SeamlessPortals client mod, and makes linked portals walk-through.
commands:
  seamlessportals:
    description: Create and manage custom portals.
    usage: /sportal help
    permission: seamlessportals.admin
    aliases: [sportal]
permissions:
  seamlessportals.admin:
    description: Create, link and delete custom portals, and use the portal wand.
    default: op
  seamlessportals.use.*:
    description: Use (and see through) every custom portal. Per portal - seamlessportals.use.<name>.
    default: op
    children:
      seamlessportals.see.*: true
  seamlessportals.see.*:
    description: See through every custom portal without using it. Per portal - seamlessportals.see.<name>.
    default: op
